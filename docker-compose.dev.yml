version: '3.8'

services:
  # MySQL Database for development
  mysql:
    image: mysql:8.0
    container_name: diary-vue-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: invest_diary
      MYSQL_USER: diary_user
      MYSQL_PASSWORD: diary_password
    ports:
      - "3307:3306"  # Different port to avoid conflicts
    volumes:
      - mysql_dev_data:/var/lib/mysql
      - ./prisma:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nuxt 3 Development Server
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: diary-vue-app-dev
    restart: unless-stopped
    ports:
      - "3000:3000"   # Nuxt dev server
      - "24678:24678" # Nuxt WebSocket for hot-reload
    environment:
      DATABASE_URL: "mysql://diary_user:diary_password@mysql:3306/invest_diary"
      JWT_SECRET: "dev-secret-key-do-not-use-in-production"
      NUXT_PUBLIC_APP_NAME: "投資日記 (Dev)"
      NODE_ENV: "development"
      PORT: "3000"
      HOST: "0.0.0.0"
      RUN_MIGRATIONS: "true"
      SEED_DATABASE: "false"  # Set to "true" to seed data on startup
    volumes:
      # Mount source code for hot-reload
      - .:/app
      - /app/node_modules  # Prevent overwriting node_modules
      - /app/.nuxt         # Preserve Nuxt cache
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_dev_data:
    driver: local
