apiVersion: batch/v1
kind: CronJob
metadata:
  name: market-rotation-batch
  namespace: diary-vue
spec:
  schedule: "30 21 * * 0-5"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: batch
              image: git.913555.xyz/etklam/invest-diary:latest
              imagePullPolicy: IfNotPresent
              env:
                - name: DATABASE_URL
                  value: "mysql://diaryvue:puvCjALat7da1aBYz4ILuLqo@diary-vue-db.diary-vue.svc.cluster.local:3306/invest_diary"
              command:
                - npx
                - tsx
                - scripts/market-rotation/run-batch.ts
