apiVersion: batch/v1
kind: CronJob
metadata:
  name: market-rotation-batch
  namespace: diary-vue
spec:
  schedule: "30 21 * * 0-5"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: batch
              image: git.913555.xyz/etklam/invest-diary:latest
              imagePullPolicy: IfNotPresent
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: diary-vue-db-creds
                      key: DATABASE_URL
              command:
                - sh
                - -ec
                - |
                  ./node_modules/.bin/tsx scripts/market-rotation/run-batch.ts
                  ./node_modules/.bin/tsx scripts/market-state/update-breadth.ts
