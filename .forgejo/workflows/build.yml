name: Quality, Build, Push and Deploy

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  REGISTRY: git.913555.xyz
  IMAGE_NAME: ${{ github.repository }}
  DEPLOY_HOST: 82.22.63.196
  DEPLOY_USER: root
  DEPLOY_NAMESPACE: diary-vue
  DEPLOY_DEPLOYMENT: diary-vue-app

jobs:
  quality:
    name: Quality and contract gates
    runs-on: hk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck production code
        run: npm run typecheck

      - name: Typecheck critical tests
        run: npm run typecheck:tests

      - name: Unit and mocked contract tests
        run: npm test -- --reporter=dot

      - name: Coverage and reconciliation gate
        run: npm run coverage:gate

      - name: Documentation health
        run: npm run docs:check

      - name: OpenAPI and generated client drift
        run: npm run openapi:check

      - name: OpenAPI breaking changes
        run: npm run openapi:breaking

      - name: Generated client smoke test
        run: npm run client:smoke

      - name: React Native fetch client contract
        run: npm run test:native-client

      - name: Install Docker CLI
        run: |
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-27.5.1.tgz | \
            tar xz --strip-components=1 -C /usr/bin docker/docker

      - name: Real Socket.IO integration contract
        run: npm run test:socketio

      - name: Real Diary reconciliation and MariaDB migration gate
        run: npm run test:diary-reconciliation:mysql

      - name: Real Nitro HTTP and MariaDB contract gate
        run: npm run test:backend-http:mariadb

      - name: Real Market Rotation MariaDB boundary gate
        run: npm run test:market-rotation:mysql

  e2e:
    name: Playwright E2E
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: hk
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install Docker CLI
        run: |
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-27.5.1.tgz | \
            tar xz --strip-components=1 -C /usr/bin docker/docker

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build application for E2E
        run: npm run build

      - name: Run full Playwright E2E
        run: npm run test:e2e

      - name: Upload Playwright report and failure artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  build-push-deploy:
    name: Build, push and deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - quality
      - e2e
    runs-on: hk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build application
        run: npm run build

      - name: Install Docker CLI
        run: |
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-27.5.1.tgz | \
            tar xz --strip-components=1 -C /usr/bin docker/docker

      - name: Login to Forgejo Registry
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ${{ env.REGISTRY }} -u etklam --password-stdin

      - name: Pull previous image for cache
        run: docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest || true

      - name: Build and push
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          docker image prune -f --filter "dangling=true" || true
          docker build \
            --pull \
            --no-cache \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHA} \
            .
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHA} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHA}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Verify Prisma client in image
        run: |
          docker run --rm --entrypoint ls ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest /app/node_modules/.prisma/client/default.js \
            || (echo "ERROR: .prisma/client missing from image!" && exit 1)

      - name: Deploy to K3s
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no \
              -i ~/.ssh/deploy_key \
              ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
              "kubectl rollout restart deployment/${{ env.DEPLOY_DEPLOYMENT }} -n ${{ env.DEPLOY_NAMESPACE }} && \
               kubectl rollout status deployment/${{ env.DEPLOY_DEPLOYMENT }} -n ${{ env.DEPLOY_NAMESPACE }} --timeout=120s"
