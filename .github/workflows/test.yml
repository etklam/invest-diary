name: Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: diary_test
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Wait for MySQL
        run: |
          echo "Waiting for MySQL to be ready..."
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -u test -ptest 2>/dev/null; then
              echo "MySQL is ready"
              break
            fi
            echo "Attempt $i/30"
            sleep 2
          done

      - name: Setup test database
        run: |
          echo "DATABASE_URL=mysql://test:test@127.0.0.1:3306/diary_test" >> .env.test
          echo "JWT_SECRET=test-secret-key-for-ci" >> .env.test
          echo "NODE_ENV=test" >> .env.test
        env:
          NODE_ENV: test

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run database migrations
        run: |
          npx prisma db push --skip-generate
        env:
          DATABASE_URL: mysql://test:test@127.0.0.1:3306/diary_test
          NODE_ENV: test

      - name: Run unit tests
        run: npm run test:unit
        env:
          DATABASE_URL: mysql://test:test@127.0.0.1:3306/diary_test
          JWT_SECRET: test-secret-key-for-ci
          NODE_ENV: test

      - name: Run integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: mysql://test:test@127.0.0.1:3306/diary_test
          JWT_SECRET: test-secret-key-for-ci
          NODE_ENV: test

      - name: Run all tests with coverage
        run: npm run test:ci
        env:
          DATABASE_URL: mysql://test:test@127.0.0.1:3306/diary_test
          JWT_SECRET: test-secret-key-for-ci
          NODE_ENV: test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true
        if: github.event_name != 'pull_request' || github.event.action != 'closed'

      - name: Health check
        run: npm run health:check
        env:
          DATABASE_URL: mysql://test:test@127.0.0.1:3306/diary_test
          JWT_SECRET: test-secret-key-for-ci
          NODE_ENV: test

  build:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: .output/