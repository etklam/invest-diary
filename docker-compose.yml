version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: diary-vue-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: invest_diary
      MYSQL_USER: diary_user
      MYSQL_PASSWORD: diary_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - diary-network

  # Nuxt 3 Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: diary-vue:latest
    container_name: diary-vue-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "mysql://diary_user:diary_password@mysql:3306/invest_diary"
      JWT_SECRET: "${JWT_SECRET:-change-this-to-a-secure-random-key-in-production}"
      NUXT_PUBLIC_APP_NAME: "投資日記"
      NODE_ENV: "production"
      PORT: "3000"
      HOST: "0.0.0.0"
      RUN_MIGRATIONS: "true"  # Run migrations on startup
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - diary-network

volumes:
  mysql_data:
    driver: local

networks:
  diary-network:
    driver: bridge
